<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>鼓手节拍器</title>
<meta name="theme-color" content="#12131c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="app">
  <div class="seg" id="seg">
    <button data-mode="metro">节拍器</button>
    <button data-mode="groove">基础节奏</button>
  </div>

  <section class="bpm">
    <div class="bpm-num" id="bpm">100</div>
    <div class="bpm-unit">BPM</div>
    <input type="range" id="bpmSlider" min="20" max="300" value="100" aria-label="速度">
    <div class="bpm-row">
      <button data-bpm="-5">-5</button>
      <button data-bpm="-1">-1</button>
      <button class="tap" id="tap">TAP</button>
      <button data-bpm="1">+1</button>
      <button data-bpm="5">+5</button>
    </div>
  </section>

  <div class="view" id="viewMetro">
  <section class="settings">
    <div class="stepper">
      <div class="stepper-label">每小节拍数</div>
      <div class="stepper-ctl">
        <button data-key="beats" data-d="-1" aria-label="减少拍数">−</button>
        <span class="stepper-val" id="beatsVal">4</span>
        <button data-key="beats" data-d="1" aria-label="增加拍数">+</button>
      </div>
      <div class="stepper-hint">1 – 16</div>
    </div>
    <div class="stepper">
      <div class="stepper-label">每拍细分数</div>
      <div class="stepper-ctl">
        <button data-key="subdiv" data-d="-1" aria-label="减少细分">−</button>
        <span class="stepper-val" id="subdivVal">1</span>
        <button data-key="subdiv" data-d="1" aria-label="增加细分">+</button>
      </div>
      <div class="stepper-hint" id="subdivHint"></div>
    </div>
  </section>

  <section class="beats" id="beats" aria-label="节拍"></section>

  <section class="pattern">
    <div class="pattern-head">
      <div>
        <div class="pattern-title">节奏型</div>
        <div class="pattern-sub">选一个应用到所有拍；点上面的方块可单独设置某一拍</div>
      </div>
      <label class="check"><input type="checkbox" id="ticks"><span>细分提示音</span></label>
    </div>
    <div class="chips" id="chips"></div>
  </section>
  </div>

  <div class="view" id="viewGroove" hidden>
    <section class="groove-card">
      <div class="groove-title" id="gTitle"></div>
      <div class="groove-desc" id="gDesc"></div>
      <button class="btn-score" id="openScore">查看曲谱</button>
      <div class="grid" id="gGrid"></div>
      <label class="check g-click"><input type="checkbox" id="gClick"><span>节拍参考音</span></label>
    </section>
    <section class="g-list" id="gList"></section>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetList"></div>
  </div>
</div>

<div class="score" id="score" hidden>
  <div class="score-head">
    <button class="score-close" id="scoreClose" aria-label="关闭曲谱">✕</button>
    <div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-sub" id="scoreSub"></div>
    </div>
  </div>
  <div class="score-body">
    <div id="scoreSvgHost"></div>
    <div class="score-legend">
      <span><b>×</b> 踩镲（线上方）</span>
      <span><b>×</b>上带圈 开镲</span>
      <span><b>●</b> 军鼓（第 3 间）</span>
      <span><b>●</b> 底鼓（第 1 间，符干朝下）</span>
    </div>
    <div class="score-tip">横屏时谱面更大更清楚</div>
  </div>
  <div class="score-bar">
    <div class="score-bpm">
      <button data-sbpm="-5">-5</button><button data-sbpm="-1">-1</button>
      <span><b id="scoreBpm">100</b> BPM</span>
      <button data-sbpm="1">+1</button><button data-sbpm="5">+5</button>
    </div>
    <button class="play" id="scorePlay">▶ 开始</button>
  </div>
</div>

<div class="play-bar">
  <button class="play" id="play">▶ 开始</button>
</div>

<script src="js/metronome.js"></script>
</body>
</html>
